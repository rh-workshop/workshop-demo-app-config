# En dev el hostname apunta al dominio de apps del cluster de desarrollo.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-service
spec:
  hostnames:
    # Sustituir por el dominio del cluster de DESARROLLO: apps.<cluster-dev>.<dominio-base>
    - canary-dev.apps.cluster-dev.ejemplo.com
