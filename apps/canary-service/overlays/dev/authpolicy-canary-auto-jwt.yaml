# En dev el issuer apunta al Keycloak del cluster de desarrollo.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  annotations:
    # Los CRDs (Kuadrant, Gateway API) los instala ACM/el operador, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: canary-service-auto
spec:
  rules:
    authentication:
      token-valido:
        jwt:
          # Dominio del cluster de laboratorio: al cambiar de cluster hay que actualizarlo aqui.
          issuerUrl: https://sso.apps.ocp.lplb4.sandbox3335.opentlc.com/realms/workshop
