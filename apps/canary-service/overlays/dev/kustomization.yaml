apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sin "namespace:" global a propósito: el RoleBinding de descarga de imagen debe
# quedarse en workshop-demo-dev (el dueño del ImageStream) y kustomize no debe
# sobrescribirlo; el resto de recursos toma el namespace destino de la Application.
resources:
  - ../../base
  - namespace-canary-demo-dev.yaml
patches:
  - path: httproute-canary-weighted-split.yaml
    target:
      kind: HTTPRoute
      name: canary-service
  - path: authpolicy-canary-jwt.yaml
    target:
      kind: AuthPolicy
      name: canary-service
# La base deja un placeholder y aquí se resuelve la imagen real: es el punto
# donde el pipeline de CI escribe el digest recién construido. Los tres servicios
# comparten esta imagen: v1 y v2 solo cambian el APP_VERSION que anuncian.
images:
  - name: app-workshop
    newName: image-registry.openshift-image-registry.svc:5000/workshop-demo-dev/app-workshop
    newTag: "1.0.0"

labels:
  - pairs:
      app.kubernetes.io/part-of: workshop-canary
      workshop.redhat.com/environment: dev
