apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sin "namespace:" global a propósito: cada recurso toma el namespace destino
# de la Application y el Namespace del overlay ya trae su nombre propio.
resources:
  - ../../base
  - namespace-canary-demo-dev.yaml
patches:
  - path: httproute-canary-weighted-split.yaml
    target:
      kind: HTTPRoute
      name: canary-service
  - path: authpolicy-canary-jwt.yaml
    target:
      kind: AuthPolicy
      name: canary-service
# La base deja un placeholder y aquí se resuelve la imagen real: es el punto
# donde el pipeline de CI escribe el digest recién construido. Los tres servicios
# comparten esta imagen: v1 y v2 solo cambian el APP_VERSION que anuncian.
# Los tres servicios de demostración de tráfico comparten el binario de
# demo-service a propósito: lo que se demuestra es el patrón de enrutado
# (canary, blue-green, corte), no aplicaciones distintas. EN PRODUCCIÓN cada
# servicio lleva su PROPIO repositorio: sin eso no hay versionado ni escaneo
# independientes, y una vulnerabilidad en uno mancha a todos.
images:
  - name: app-workshop
    newName: company-quay-quay-quay-enterprise.apps.cluster-qthlq.dyn.redhatworkshops.io/company/demo-service
    digest: sha256:b88648dc00b39091ea04e499ab0cb20eb1ebbb43aea5602f00ef59a8f309355d

labels:
  - pairs:
      app.kubernetes.io/part-of: workshop-canary
      workshop.redhat.com/environment: dev
