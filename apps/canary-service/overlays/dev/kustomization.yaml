apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: canary-demo-dev
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: canary-service-httproute.yaml
    target:
      kind: HTTPRoute
      name: canary-service
  - path: canary-service-authpolicy.yaml
    target:
      kind: AuthPolicy
      name: canary-service
# La base deja un placeholder y aquí se resuelve la imagen real: es el punto
# donde el pipeline de CI escribe el digest recién construido. Los tres servicios
# comparten esta imagen: v1 y v2 solo cambian el APP_VERSION que anuncian.
images:
  - name: workshop-demo-app
    newName: image-registry.openshift-image-registry.svc:5000/workshop-demo-dev/workshop-demo-app
    newTag: "1.0.0"

labels:
  - pairs:
      app.kubernetes.io/part-of: workshop-canary
      workshop.redhat.com/environment: dev
