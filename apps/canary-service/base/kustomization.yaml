apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Canary por PESOS de HTTPRoute: Connectivity Link (Gateway API) reparte el
  # trafico entre v1 y v2 segun el weight de cada backendRef. Promocionar es
  # editar esos pesos en Git y dejar que Argo sincronice.
  - deployment-canary-v1-stable.yaml
  - deployment-canary-v2-candidate.yaml
  - service-canary-v1.yaml
  - service-canary-v2.yaml
  - httproute-canary-weighted-split.yaml
  - authpolicy-canary-jwt.yaml
