apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Canary MANUAL por pesos de HTTPRoute (material original del workshop): se conserva intacto.
  - deployment-canary-v1-stable.yaml
  - deployment-canary-v2-candidate.yaml
  - service-canary-v1.yaml
  - service-canary-v2.yaml
  - httproute-canary-weighted-split.yaml
  - authpolicy-canary-jwt.yaml
  # Canary AUTOMÁTICO con Argo Rollouts (promociona o revierte solo por métricas): convive con el manual en /canary-auto.
  - rollout-canary-auto.yaml
  - analysistemplate-canary-success-rate.yaml
  # La identidad con la que el análisis lee las métricas (ServiceAccount +
  # ClusterRoleBinding a cluster-monitoring-view + token) YA NO SE DECLARA AQUÍ:
  # un ClusterRoleBinding es de ámbito de cluster y permitirlo desde este repo
  # convertía cualquier commit en cluster-admin efectivo. Vive en el repo de
  # plataforma, en namespace-governance/gitops/base/namespaces/canary-demo-dev/.
  # - serviceaccount-thanos-reader.yaml
  - service-canary-auto.yaml
  - httproute-canary-auto.yaml
  - authpolicy-canary-auto-jwt.yaml
