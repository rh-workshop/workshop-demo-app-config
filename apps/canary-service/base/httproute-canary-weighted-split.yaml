# El corazon del canary: UN HTTPRoute con dos backendRefs, cada uno con su weight.
# Connectivity Link (Gateway API) reparte el trafico segun el peso. Subir v2 de
# 10 -> 50 -> 100 promociona el canary sin downtime; se hace editando estos pesos
# en Git y dejando que Argo sincronice.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    # Los CRDs (Kuadrant, Gateway API) los instala ACM/el operador, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: canary-service
spec:
  parentRefs:
    - name: shared-gateway
      namespace: platform-gateway
  hostnames:
    - apis.apps.cluster-qthlq.dyn.redhatworkshops.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /canary
      filters:
        - type: URLRewrite
          urlRewrite:
            # El servicio sirve en la raiz: se le quita el prefijo del path con
            # el que se le distingue en el dominio compartido. Sin esto recibiria
            # /canary/loquesea y responderia 404.
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: canary-service-v1
          port: 8080
          weight: 90
        - name: canary-service-v2
          port: 8080
          weight: 10
