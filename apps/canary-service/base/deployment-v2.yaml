# Version NUEVA (v2) del servicio canary — la que recibe un % del trafico.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-service-v2
  labels:
    app: canary-service
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-service
      version: v2
  template:
    metadata:
      labels:
        app: canary-service
        version: v2
    spec:
      containers:
        - name: app
          image: demo-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "2.0.0-canary"
            - name: APP_ENTORNO
              value: dev
