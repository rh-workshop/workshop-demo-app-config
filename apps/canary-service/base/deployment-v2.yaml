# Version NUEVA (v2) del servicio canary — la que recibe un % del trafico.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-service-v2
  labels:
    app: canary-service
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-service
      version: v2
  template:
    metadata:
      labels:
        app: canary-service
        version: v2
    spec:
      containers:
        - name: app
          image: workshop-demo-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "2.0.0-canary"
            - name: APP_NOMBRE
              value: canary-service
            - name: APP_ENTORNO
              value: dev
          # Las sondas usan el endpoint de salud de la aplicación.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Contexto de seguridad restrictivo: sin privilegios, sin escalada y
          # con el sistema de archivos raíz en solo lectura.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
