# Version ESTABLE (v1) del servicio canary. Reutiliza la imagen del servicio de
# demostracion, distinguiendola por APP_VERSION.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-service-v1
  labels:
    app: canary-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: canary-service
      version: v1
  template:
    metadata:
      labels:
        app: canary-service
        version: v1
    spec:
      containers:
        - name: app
          image: demo-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.0.0-stable"
            - name: APP_ENTORNO
              value: dev
