apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sin "namespace:" global a propósito: el RoleBinding de descarga de imagen debe
# quedarse en workshop-demo-dev (el dueño del ImageStream) y kustomize no debe
# sobrescribirlo; el resto de recursos toma el namespace destino de la Application.
resources:
  - ../../base
  - namespace-bluegreen-demo-dev.yaml
patches:
  - path: httproute-bluegreen-traffic-switch.yaml
    target:
      kind: HTTPRoute
      name: bluegreen-service
  - path: authpolicy-bluegreen-jwt.yaml
    target:
      kind: AuthPolicy
      name: bluegreen-service

# La base deja un placeholder y aquí se resuelve la imagen real: es el punto
# donde el pipeline de CI escribe el digest recién construido.
images:
  - name: app-workshop
    newName: image-registry.openshift-image-registry.svc:5000/workshop-demo-dev/app-workshop
    newTag: "1.0.0"

labels:
  - pairs:
      app.kubernetes.io/part-of: workshop-bluegreen
      workshop.redhat.com/environment: dev
