apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sin "namespace:" global a propósito: el RoleBinding de descarga de imagen debe
# quedarse en workshop-demo-dev (el dueño del ImageStream) y kustomize no debe
# sobrescribirlo; el resto de recursos toma el namespace destino de la Application.
resources:
  - ../../base
  - namespace-bluegreen-demo-dev.yaml
patches:
  - path: httproute-bluegreen-traffic-switch.yaml
    target:
      kind: HTTPRoute
      name: bluegreen-service
  - path: authpolicy-bluegreen-jwt.yaml
    target:
      kind: AuthPolicy
      name: bluegreen-service

# La base deja un placeholder y aquí se resuelve la imagen real: es el punto
# donde el pipeline de CI escribe el digest recién construido.
# Los tres servicios de demostración de tráfico comparten el binario de
# demo-service a propósito: lo que se demuestra es el patrón de enrutado
# (canary, blue-green, corte), no aplicaciones distintas. EN PRODUCCIÓN cada
# servicio lleva su PROPIO repositorio: sin eso no hay versionado ni escaneo
# independientes, y una vulnerabilidad en uno mancha a todos.
images:
  - name: app-workshop
    newName: company-quay-quay-quay-enterprise.apps.cluster-qthlq.dyn.redhatworkshops.io/company/demo-service
    digest: sha256:01aa60c7772872bf76e5b03bde06a6c4755e331d6b85d0502a15859a81c11027

labels:
  - pairs:
      app.kubernetes.io/part-of: workshop-bluegreen
      workshop.redhat.com/environment: dev
