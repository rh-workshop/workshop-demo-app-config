# Version blue. Las dos conviven desplegadas; lo que decide cual recibe trafico
# es el peso del HTTPRoute, no el numero de replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bluegreen-service-blue
  labels:
    app: bluegreen-service
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bluegreen-service
      version: blue
  template:
    metadata:
      labels:
        app: bluegreen-service
        version: blue
    spec:
      containers:
        - name: app
          image: app-workshop:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.0.0-blue"
            - name: APP_NOMBRE
              value: bluegreen-service
            - name: APP_ENTORNO
              value: dev
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
