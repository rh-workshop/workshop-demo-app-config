# Un único Service para el Rollout: sin trafficRouting el reparto lo hace el
# propio Service entre las réplicas de cada versión, según el peso del paso en
# curso. Argo Rollouts mantiene el selector al día.
apiVersion: v1
kind: Service
metadata:
  name: rollout-service
spec:
  selector:
    app: rollout-service
  ports:
    - port: 8080
      targetPort: 8080
      name: http
