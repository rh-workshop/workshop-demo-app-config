# Entrega progresiva con Argo Rollouts.
#
# Un Rollout sustituye al Deployment: gestiona el ReplicaSet igual, pero además
# avanza por PASOS declarados, con pausas entre ellos, y permite promover o
# abortar a mitad de camino.
#
# Diferencia con el canary por peso de HTTPRoute (apps/canary-service): allí el
# reparto lo fija una persona editando el peso en Git; aquí lo conduce el
# controlador siguiendo esta receta. Ambos caminos son válidos y el workshop
# muestra los dos.
#
# Sin trafficRouting el reparto es POR RÉPLICAS: con 5 réplicas, setWeight 20
# levanta 1 pod de la versión nueva y el Service reparte entre los 5. Enrutar
# por peso de HTTPRoute exigiría un plugin externo a los operadores Red Hat.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout-service
  labels:
    app: rollout-service
spec:
  replicas: 5
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: rollout-service
  template:
    metadata:
      labels:
        app: rollout-service
    spec:
      containers:
        - name: app
          image: app-workshop:latest
          ports:
            - containerPort: 8080
          env:
            # Al cambiar este valor y sincronizar, el controlador arranca un
            # despliegue progresivo: es lo que se ve avanzar en el panel.
            - name: APP_VERSION
              value: "1.0.0-stable"
            - name: APP_NOMBRE
              value: rollout-service
            - name: APP_ENTORNO
              value: dev
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
  strategy:
    canary:
      # La receta del despliegue. Las pausas con duración avanzan solas; una
      # pausa SIN duración se queda esperando hasta que alguien promueve:
      #   oc argo rollouts promote rollout-service -n rollout-demo-dev
      steps:
        - setWeight: 20
        - pause: {duration: 30s}
        - setWeight: 40
        - pause: {duration: 30s}
        - setWeight: 60
        - pause: {duration: 30s}
        - setWeight: 80
        - pause: {duration: 30s}
