# Un solo backendRef, a diferencia del canary por peso: aquí no reparte el
# HTTPRoute, sino el propio Service entre las réplicas que el controlador de
# Argo Rollouts va sustituyendo paso a paso.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rollout-service
spec:
  parentRefs:
    - name: shared-gateway
      namespace: platform-gateway
  hostnames:
    - rollout-dev.apps.CHANGE_ME_DOMINIO
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rollout-service
          port: 8080
