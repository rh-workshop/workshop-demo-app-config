# Servicio protegido por circuit breaker. El breaker lo aplica el sidecar Envoy
# (inyectado por Istio), no la app: por eso el pod debe entrar al mesh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circuit-breaker-service
  labels:
    app: circuit-breaker-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: circuit-breaker-service
  template:
    metadata:
      labels:
        app: circuit-breaker-service
      annotations:
        # Fuerza la inyeccion del sidecar de Istio en este pod.
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: app
          image: workshop-demo-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_NOMBRE
              value: circuit-breaker-service
            - name: APP_ENTORNO
              value: dev
          # Solo sonda de vida: la readiness se omite A PROPOSITO. Quien debe
          # expulsar la instancia que falla es Envoy (outlierDetection de la
          # DestinationRule), no kubelet; con readinessProbe el pod saldria del
          # Endpoint antes y no se veria el corte del sidecar.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
