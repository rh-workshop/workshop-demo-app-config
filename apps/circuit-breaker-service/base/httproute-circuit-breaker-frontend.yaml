apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: circuit-breaker-service
spec:
  parentRefs:
    - name: shared-gateway
      namespace: platform-gateway
  hostnames:
    - apis.apps.cluster-qthlq.dyn.redhatworkshops.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /circuit-breaker
      filters:
        - type: URLRewrite
          urlRewrite:
            # El servicio sirve en la raiz: se le quita el prefijo del path con
            # el que se le distingue en el dominio compartido. Sin esto recibiria
            # /circuit-breaker/loquesea y responderia 404.
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: service1-frontend
          port: 8080
