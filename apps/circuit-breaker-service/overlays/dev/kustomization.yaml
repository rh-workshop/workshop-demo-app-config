apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: circuit-breaker-demo-dev
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: circuit-breaker-service-httproute.yaml
    target:
      kind: HTTPRoute
      name: circuit-breaker-service
  - path: circuit-breaker-service-authpolicy.yaml
    target:
      kind: AuthPolicy
      name: circuit-breaker-service
# La base deja un placeholder y aquí se resuelve la imagen real: es el punto
# donde el pipeline de CI escribe el digest recién construido. Circuit-breaker
# reutiliza la imagen de demo-service; lo que se demuestra es el corte, no la app.
images:
  - name: demo-service
    newName: image-registry.openshift-image-registry.svc:5000/workshop-demo-dev/demo-service
    newTag: "1.0.0"

labels:
  - pairs:
      app.kubernetes.io/part-of: workshop-circuit-breaker
      workshop.redhat.com/environment: dev
