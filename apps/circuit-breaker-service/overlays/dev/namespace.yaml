# El namespace necesita los labels del gateway compartido Y la inyeccion de
# sidecar de Istio (istio-injection): sin el sidecar, la DestinationRule no se
# aplica (el circuit breaker vive en Envoy).
apiVersion: v1
kind: Namespace
metadata:
  name: circuit-breaker-demo-dev
  labels:
    # Cede el namespace a la instancia central de Argo CD (RBAC del operador GitOps).
    argocd.argoproj.io/managed-by: openshift-gitops
    shared-gateway-access: "true"
    istio-discovery: enabled
    istio-injection: enabled
