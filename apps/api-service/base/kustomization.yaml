# Base común de la API de negocio: el "qué" se despliega.
# El "dónde" y el "cuánto" los deciden los overlays de cada entorno.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment-api-service.yaml
  - service-api-service.yaml
  - configmap-api-service-env-config.yaml
  - httproute-api-service.yaml
  - authpolicy-api-service-jwt.yaml
  - ratelimitpolicy-api-service-per-route.yaml
