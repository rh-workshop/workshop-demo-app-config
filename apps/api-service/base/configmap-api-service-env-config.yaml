# Configuración de la API de negocio. Cada overlay sobrescribe estos valores
# para su entorno. No contiene ningún dato sensible: los secretos se referencian
# por nombre desde un Secret, nunca se escriben en Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-service-config
data:
  APP_NOMBRE: "api-service"
  APP_VERSION: "1.0.0"
  APP_ENTORNO: "base"
  APP_MENSAJE: "API de negocio del workshop (cuentas y pagos)"
