# Deployment de la API de negocio (cuentas y pagos) del workshop.
#
# La etiqueta de la imagen la fija cada overlay mediante la transformación
# "images" de Kustomize: la base no conoce el registro ni la versión.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/part-of: workshop-gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-service
    spec:
      containers:
        - name: api-service
          image: api-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # La configuración se inyecta desde el ConfigMap, nunca se hornea en
          # la imagen. Así la misma imagen sirve para todos los entornos.
          envFrom:
            - configMapRef:
                name: api-service-config
          # Las sondas usan el endpoint de salud de la aplicación.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Contexto de seguridad restrictivo: sin privilegios, sin escalada y
          # con el sistema de archivos raíz en solo lectura.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
