# Service interno de la API de negocio. La exposición al exterior NO se hace
# con una Route, sino con un HTTPRoute a través del gateway compartido.
apiVersion: v1
kind: Service
metadata:
  name: api-service
  labels:
    app.kubernetes.io/name: api-service
    app.kubernetes.io/part-of: workshop-gitops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
