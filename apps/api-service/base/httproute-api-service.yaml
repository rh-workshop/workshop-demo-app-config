# Exposición de la API de negocio a través del gateway compartido de la
# plataforma. El gateway vive en su propio namespace y lo gobierna el equipo de
# plataforma; la aplicación solo declara su ruta y se adjunta a él.
# El hostname se parchea por overlay.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    # Los CRDs (Kuadrant, Gateway API) los instala ACM/el operador, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: api-service
spec:
  parentRefs:
    - name: shared-gateway
      namespace: platform-gateway
  hostnames:
    - apis.apps.cluster-qthlq.dyn.redhatworkshops.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-service
          port: 8080
