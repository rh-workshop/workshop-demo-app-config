# Overlay del entorno de desarrollo de la API de negocio.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sin "namespace:" global a propósito: el RoleBinding de descarga de imagen debe
# quedarse en workshop-demo-dev (el dueño del ImageStream) y kustomize no debe
# sobrescribirlo; el resto de recursos toma el namespace destino de la Application.

resources:
- ../../base
- namespace-api-demo-dev.yaml

patches:
- path: httproute-api-service.yaml
  target:
    kind: HTTPRoute
    name: api-service
- path: authpolicy-api-service-jwt.yaml
  target:
    kind: AuthPolicy
    name: api-service
- path: configmap-api-service-env-config.yaml
  target:
    kind: ConfigMap
    name: api-service-config

# La base deja un placeholder y aquí se resuelve la imagen real: es el punto
# donde el pipeline de CI escribe el digest recién construido. La imagen vive
# en el ImageStream de workshop-demo-dev (donde publica el pipeline), aunque
# los pods corran en api-demo-dev: de ahí el RoleBinding image-puller.
images:
- digest: sha256:6cd4388e752b71e1fedd6c625661e9658779af9acdc5587cc43ad98354da61ef
  name: api-service
  newName: company-quay-quay-quay-enterprise.apps.cluster-qthlq.dyn.redhatworkshops.io/company/api-service

labels:
- pairs:
    workshop.redhat.com/environment: dev
