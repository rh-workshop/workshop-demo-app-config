# Route de OpenShift (passthrough) que lleva el tráfico del router HAProxy al
# gateway Istio compartido. VIVE en platform-gateway (junto al gateway), no en
# el namespace del servicio. Sin esta Route, el router devuelve 503 sin llegar
# al gateway. El host se parchea por overlay.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api-gateway
  namespace: platform-gateway
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  host: api-dev.apps.CHANGE_ME_DOMINIO
  port:
    targetPort: 443
  tls:
    termination: passthrough
  to:
    kind: Service
    name: shared-gateway-istio
