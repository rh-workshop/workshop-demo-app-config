# Overlay del entorno de desarrollo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workshop-demo-dev

resources:
- ../../base
- namespace-workshop-demo-dev.yaml
- httproute-demo-service.yaml

# La imagen se resuelve contra el registro interno de OpenShift. En una
# plataforma real este valor apuntaría al registro corporativo (Quay).
images:
- digest: sha256:8d218a1c139ced1bd792519bda0ee91c1ddcfbc23926daf0f87e5f387b7141b0
  name: app-workshop
  newName: image-registry.openshift-image-registry.svc:5000/workshop-demo-dev/app-workshop

# En desarrollo basta una réplica; los valores de configuración identifican
# el entorno en la respuesta del servicio.
# El issuer de Keycloak es propio de cada entorno.
patches:
- path: authpolicy-demo-service-jwt.yaml
  target:
    kind: AuthPolicy
    name: demo-service
- path: configmap-demo-service-env-config.yaml
  target:
    kind: ConfigMap
    name: demo-service-config
