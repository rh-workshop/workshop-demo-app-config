# Overlay del entorno de desarrollo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workshop-demo-dev

resources:
- ../../base
- namespace-workshop-demo-dev.yaml
- httproute-demo-service.yaml

# La imagen se resuelve contra el registro corporativo (Quay) y se fija
# SIEMPRE por digest: es el campo que el pipeline de CI actualiza al promocionar.
images:
- digest: sha256:6bf6aa621b1e8e1e144a342e63d3dc7316bcfe9c637239ea441df61a9725e509
  name: app-workshop
  newName: company-quay-quay-quay-enterprise.apps.ocp.hq2ss.sandbox3270.opentlc.com/company-dev/demo-service

# En desarrollo basta una réplica; los valores de configuración identifican
# el entorno en la respuesta del servicio.
# El issuer de Keycloak es propio de cada entorno.
patches:
- path: authpolicy-demo-service-jwt.yaml
  target:
    kind: AuthPolicy
    name: demo-service
- path: configmap-demo-service-env-config.yaml
  target:
    kind: ConfigMap
    name: demo-service-config
