# Exposición del servicio a través del gateway compartido de la plataforma.
# El gateway vive en su propio namespace y lo gobierna el equipo de plataforma;
# la aplicación solo declara su ruta y se adjunta a él.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    # Los CRDs (Kuadrant, Gateway API) los instala ACM/el operador, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: demo-service
spec:
  parentRefs:
    - name: shared-gateway
      namespace: platform-gateway
  hostnames:
    # Dominio del cluster de laboratorio: al cambiar de cluster hay que actualizarlo aqui.
    - apis.apps.cluster-qthlq.dyn.redhatworkshops.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /demo
      filters:
        - type: URLRewrite
          urlRewrite:
            # El servicio sirve en la raiz: se le quita el prefijo del path con
            # el que se le distingue en el dominio compartido. Sin esto recibiria
            # /demo/loquesea y responderia 404.
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: demo-service
          port: 8080
