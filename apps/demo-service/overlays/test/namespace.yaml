# Namespace del entorno de pruebas.
#
# Ambas etiquetas son imprescindibles para la exposición por el gateway
# compartido: "shared-gateway-access" para que el listener admita la ruta e
# "istio-discovery" para que istiod descubra el namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: workshop-demo-test
  labels:
    # Autoriza al controlador de Argo CD a gestionar recursos en este namespace.
    # Sin esta etiqueta, Argo CD puede leer pero no crear: la sincronización
    # falla con "forbidden" al intentar crear el Deployment o el Service.
    argocd.argoproj.io/managed-by: openshift-gitops
    shared-gateway-access: "true"
    istio-discovery: enabled
    app.kubernetes.io/part-of: workshop-gitops
