# Exposición del servicio de pruebas a través del gateway compartido.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-service
spec:
  parentRefs:
    - name: shared-gateway
      namespace: platform-gateway
  hostnames:
    # Sustituir por el dominio del cluster donde corre TEST (en este workshop, el de DESARROLLO): apps.<cluster-dev>.<dominio-base>
    - demo-test.apps.cluster-dev.ejemplo.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /demo
      filters:
        - type: URLRewrite
          urlRewrite:
            # El servicio sirve en la raiz: se le quita el prefijo del path con
            # el que se le distingue en el dominio compartido. Sin esto recibiria
            # /demo/loquesea y responderia 404.
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: demo-service
          port: 8080
