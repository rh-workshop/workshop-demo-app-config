# Overlay del entorno de pruebas.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workshop-demo-test

resources:
  - ../../base
  - namespace.yaml
  - demo-service-httproute.yaml

images:
  - name: workshop-demo-app
    newName: image-registry.openshift-image-registry.svc:5000/workshop-demo-test/workshop-demo-app
    newTag: "1.0.0"

patches:
  - path: demo-service-configmap.yaml
    target:
      kind: ConfigMap
      name: demo-service-config
  # A diferencia de desarrollo, pruebas ejecuta dos réplicas: el mismo "qué"
  # de la base con un "cuánto" distinto, que es el papel de un overlay.
  - path: deployment-replicas.yaml
    target:
      kind: Deployment
      name: demo-service
