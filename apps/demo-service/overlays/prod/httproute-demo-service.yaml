# Exposición del servicio de PRODUCCION a través del gateway compartido.
#
# EL HOSTNAME ES DE NEGOCIO, no el dominio *.apps del cluster, y ese es el punto:
# es el mismo que publica el sitio de CONTINGENCIA. Conmutar entre sitios es
# reapuntar el DNS a otro gateway, sin que quien consume la API cambie nada.
#
# Atarlo a `*.apps.<cluster>` haria imposible el failover: el listener del sitio
# de respaldo lleva OTRO dominio y un HTTPRoute solo se adjunta si su hostname
# interseca con el del listener, asi que la ruta no llegaria a programarse alli.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    # Los CRDs (Kuadrant, Gateway API) los instala ACM/el operador, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: demo-service
spec:
  parentRefs:
    - name: shared-gateway
      namespace: platform-gateway
  hostnames:
    # Dominio de NEGOCIO, servido por el listener `https-business` del gateway.
    # Identico en produccion y contingencia: sustituir por el del cliente.
    - demo.api.workshop.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /demo
      filters:
        - type: URLRewrite
          urlRewrite:
            # El servicio sirve en la raiz: se le quita el prefijo del path con
            # el que se le distingue en el dominio compartido. Sin esto recibiria
            # /demo/loquesea y responderia 404.
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: demo-service
          port: 8080
