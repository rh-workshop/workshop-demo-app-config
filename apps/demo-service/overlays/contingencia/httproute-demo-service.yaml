# Exposición del servicio en el sitio de CONTINGENCIA.
#
# Es la MISMA ruta que en producción, sobre el gateway compartido del cluster de
# contingencia: mismo hostname, mismo path y mismo backend. La diferencia entre
# los dos sitios no está aquí, está en a cuál apunta el DNS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    # Los CRDs (Kuadrant, Gateway API) los instala ACM/el operador, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: demo-service
spec:
  parentRefs:
    - name: shared-gateway
      namespace: platform-gateway
  hostnames:
    # EL MISMO HOSTNAME QUE PRODUCCION, a propósito. El sitio de contingencia
    # existe para sustituir a producción sin que el cliente cambie nada: si
    # respondiera en `demo-contingencia.<dominio>`, conmutar exigiría reconfigurar
    # a quien consume la API, y eso no es un failover. Lo que se conmuta es el DNS
    # (o el balanceador global), que reapunta ESTE nombre al gateway del sitio
    # activo. Por eso el dominio NO lleva el ambiente en el nombre.
    - demo-prod.apps.ocp.2rndh.sandbox213.opentlc.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /demo
      filters:
        - type: URLRewrite
          urlRewrite:
            # El servicio sirve en la raiz: se le quita el prefijo del path con
            # el que se le distingue en el dominio compartido. Sin esto recibiria
            # /demo/loquesea y responderia 404.
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: demo-service
          port: 8080
