# Configuración de la aplicación. Cada overlay sobrescribe estos valores para su
# entorno. No contiene ningún dato sensible: los secretos se referencian por
# nombre desde un Secret, nunca se escriben en Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-service-config
data:
  APP_VERSION: "1.0.0"
  APP_ENTORNO: "base"
  APP_MENSAJE: "Servicio de demostración del flujo GitOps"
