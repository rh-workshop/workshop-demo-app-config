# Políticas de exposición del servicio de demostración.
# Se mantienen separadas de los manifiestos de la aplicación para que se vea que
# son una preocupación distinta: la aplicación declara QUÉ expone y las
# políticas declaran CÓMO se consume.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - demo-service-authpolicy.yaml
  - demo-service-ratelimitpolicy.yaml
