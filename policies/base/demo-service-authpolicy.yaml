# AuthPolicy del servicio de demostración.
#
# Se declara sobre el HTTPRoute de la aplicación y, por tanto, SUSTITUYE a la
# política por defecto del gateway para esta ruta concreta. Es el patrón normal:
# la plataforma fija un mínimo seguro y cada API lo afina.
#
# Comprobación esperada: sin cabecera Authorization -> 401; con un token válido
# emitido por el realm de confianza -> 200.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: demo-service
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: demo-service
  rules:
    authentication:
      token-valido:
        jwt:
          issuerUrl: https://sso.apps.cluster-qthlq.dyn.redhatworkshops.io/realms/workshop
        credentials:
          authorizationHeader:
            prefix: Bearer
    response:
      success:
        # "headers" propaga la identidad al servicio de backend, para que la
        # aplicación sepa quién llama sin tener que validar el token otra vez.
        headers:
          x-identidad:
            json:
              properties:
                sujeto:
                  selector: auth.identity.sub
                cliente:
                  selector: auth.identity.azp
        # "filters" publica la identidad en los metadatos dinámicos del gateway.
        # Es el canal que lee la RateLimitPolicy. OJO: el nombre del filtro DEBE
        # ser "identity" — el wasm-shim resuelve el namespace CEL "auth.<filtro>"
        # con el nombre literal del filtro, así que "auth.identity.clientid" solo
        # existe si el filtro se llama "identity". Con otro nombre (p. ej.
        # "identidad") el contador falla con NoSuchKey("identity") y el 429
        # nunca dispara aunque ambas políticas figuren como Enforced.
        filters:
          identity:
            json:
              properties:
                clientid:
                  selector: auth.identity.azp
                sub:
                  selector: auth.identity.sub
