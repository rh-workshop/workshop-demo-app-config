# Políticas aplicadas al entorno de desarrollo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workshop-demo-dev

resources:
  - ../../base

# Sin este parche la AuthPolicy quedaría con el issuer marcador de la base y toda petición daría 401.
patches:
  - path: demo-service-authpolicy.yaml
    target:
      kind: AuthPolicy
      name: demo-service
