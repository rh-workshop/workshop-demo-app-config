# Pipeline de CI: construye la imagen y la promociona en el repo de configuracion.
#
# Es la mitad "integracion" del flujo: toma el CODIGO (repo de aplicacion),
# construye y FIRMA la imagen, la publica en el registro, y luego escribe el
# digest en el repo de CONFIGURACION. Ese git push es lo que dispara el CD.
#
# Maneja los DOS repos: lee el de aplicacion, escribe en el de configuracion.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci-construir-imagen
spec:
  params:
    - {name: repo-aplicacion, default: "https://github.com/rh-workshop/workshop-demo-app.git"}
    - {name: repo-configuracion, default: "https://github.com/rh-workshop/workshop-demo-config.git"}
    - {name: revision, default: main}
    - name: imagen
    - {name: containerfile, default: ./Containerfile}
    - {name: ruta-overlay, default: apps/servicio-demo/overlays/dev}
  workspaces:
    - name: fuente
    - name: configuracion
    - name: credenciales-git
  results:
    - name: imagen-digest
      value: $(tasks.construir-y-publicar-imagen.results.IMAGE_DIGEST)
  tasks:
    - name: clonar-codigo-fuente
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: git-clone}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: URL, value: $(params.repo-aplicacion)}
        - {name: REVISION, value: $(params.revision)}
      workspaces: [{name: output, workspace: fuente}]

    - name: construir-y-publicar-imagen
      runAfter: [clonar-codigo-fuente]
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: buildah}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: IMAGE, value: $(params.imagen)}
        - {name: DOCKERFILE, value: $(params.containerfile)}
        - {name: TLS_VERIFY, value: "false"}
      workspaces: [{name: source, workspace: fuente}]

    - name: clonar-repo-configuracion
      runAfter: [construir-y-publicar-imagen]
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: git-clone}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: URL, value: $(params.repo-configuracion)}
        - {name: REVISION, value: main}
      workspaces: [{name: output, workspace: configuracion}]

    - name: actualizar-digest-con-kustomize
      runAfter: [clonar-repo-configuracion]
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: git-cli}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: GIT_USER_NAME, value: "pipeline-ci"}
        - {name: GIT_USER_EMAIL, value: "pipeline-ci@ejemplo.local"}
        - name: GIT_SCRIPT
          value: |
            cd $(params.ruta-overlay)
            sed -i "s|newTag:.*|digest: $(tasks.construir-y-publicar-imagen.results.IMAGE_DIGEST)|" kustomization.yaml
            git commit -am "ci: promociona servicio-demo al digest recien construido"
            git push origin HEAD
      workspaces:
        - {name: source, workspace: configuracion}
        - {name: basic-auth, workspace: credenciales-git}
