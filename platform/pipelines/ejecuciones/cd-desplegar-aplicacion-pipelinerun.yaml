# Ejecución del pipeline de CD.
#
# Normalmente lo dispara el git push que hace el CI, pero también se puede lanzar
# a mano para probar solo el despliegue. Se crea con "oc create" (no "oc apply").
#
#   oc create -f platform/pipelines/ejecuciones/cd-desplegar-aplicacion-pipelinerun.yaml -n workshop-demo-dev
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: cd-desplegar-aplicacion-
  labels:
    app.kubernetes.io/part-of: workshop-gitops
  annotations:
    pipeline.tekton.dev/affinity-assistant: disabled
spec:
  pipelineRef:
    name: cd-desplegar-aplicacion
  # Identidad con permiso para pedirle la sincronización a Argo CD.
  taskRunTemplate:
    serviceAccountName: constructor
  workspaces:
    - name: configuracion
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: ocs-external-storagecluster-ceph-rbd-immediate
          resources:
            requests:
              storage: 1Gi
