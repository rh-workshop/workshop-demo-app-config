# AppProject de la PLATAFORMA del workshop.
#
# Un AppProject es la frontera de gobierno de Argo CD: acota de qué
# repositorios puede desplegar, a qué destinos y qué tipos de recurso puede
# crear. En una plataforma real habría un proyecto por dominio o por equipo, de
# modo que un equipo no pueda desplegar en el espacio de otro.
#
# Este proyecto agrupa SOLO los componentes de plataforma (gateway, pipelines,
# políticas, servicio-demo). Las Applications de los participantes usan un
# proyecto aparte, `workshop`, con sus propias barandillas: destinos acotados a
# los espacios `user*` y su propio origen de repositorios. Separarlos es la
# práctica recomendada — un proyecto por dominio, para que un equipo no
# despliegue en el espacio de otro.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workshop-platform
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  description: Componentes de plataforma del workshop de OpenShift.

  # Solo se admite el repositorio de configuración del workshop.
  sourceRepos:
    - https://github.com/rh-workshop/workshop-demo-config.git

  # Destinos permitidos: los namespaces de plataforma.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: workshop-demo-dev
    - server: https://kubernetes.default.svc
      namespace: workshop-demo-test
    - server: https://kubernetes.default.svc
      namespace: platform-gateway
    - server: https://kubernetes.default.svc
      namespace: kuadrant-system

  # El proyecto necesita crear recursos de ámbito de cluster (Namespace) y las
  # políticas de Connectivity Link.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
