# AuthPolicy por DEFECTO del gateway: seguridad "secure by default".
#
# Al declararse con "defaults", se aplica a toda ruta adjunta al gateway que no
# tenga su propia AuthPolicy. Una ruta nueva queda protegida desde el primer
# momento, sin depender de que su equipo se acuerde de protegerla.
#
# Una AuthPolicy definida sobre un HTTPRoute concreto tiene precedencia sobre
# esta y la sustituye para esa ruta.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: shared-gateway-default
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shared-gateway
  defaults:
    strategy: atomic
    rules:
      authentication:
        token-valido:
          # Solo se acepta un JWT firmado por el emisor de confianza. Sin
          # cabecera Authorization válida, el gateway responde 401.
          jwt:
            # Sustituir por el issuer del Keycloak del cluster (valor genérico de la base; se ajusta por overlay): https://sso.apps.<cluster>.<dominio-base>/realms/workshop
            issuerUrl: https://sso.apps.cluster.ejemplo.com/realms/workshop
          credentials:
            authorizationHeader:
              prefix: Bearer
