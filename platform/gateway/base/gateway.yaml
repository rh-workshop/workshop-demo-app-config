# Gateway compartido de la plataforma (Gateway API nativo).
#
# Es un único punto de entrada gobernado por el equipo de plataforma. Las
# aplicaciones NO crean su propio gateway: se adjuntan a este mediante un
# HTTPRoute desde su propio namespace.
#
# El listener solo admite rutas de los namespaces etiquetados con
# "shared-gateway-access: true", que es el mecanismo de autorización entre el
# equipo de plataforma y los equipos de aplicación.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  labels:
    app.kubernetes.io/part-of: workshop-plataforma
spec:
  gatewayClassName: istio
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      # Sustituir por el dominio comodín de apps del cluster (valor genérico de la base; se ajusta por overlay): *.apps.<cluster>.<dominio-base>
      hostname: "*.apps.cluster.ejemplo.com"
      tls:
        mode: Terminate
        certificateRefs:
          # El certificado lo emite cert-manager a través de la TLSPolicy; aquí
          # solo se referencia el Secret por su NOMBRE, nunca su contenido.
          - kind: Secret
            group: ""
            name: shared-gateway-https
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              shared-gateway-access: "true"
