# Controlador de Argo Rollouts.
#
# Lo instala el MISMO operador de OpenShift GitOps que gobierna Argo CD: no hace
# falta otro operador ni un catálogo aparte. Argo CD despliega; Argo Rollouts
# decide CÓMO avanza ese despliegue (por pasos, con pausas y con vuelta atrás).
#
# Ojo con la versión de API: el CR Rollout y este RolloutManager van en
# argoproj.io/v1alpha1, mientras que el CR ArgoCD pasó a v1beta1 en GitOps 1.12.
# Son distintas y se confunden con facilidad.
apiVersion: argoproj.io/v1alpha1
kind: RolloutManager
metadata:
  name: argo-rollouts
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  # Ámbito de cluster (el valor por defecto): un solo controlador atiende los
  # Rollout de todos los namespaces, igual que el Argo CD del workshop.
  namespaceScoped: false
