# Application raíz — patrón "app of apps".
#
# La aplica el BOOTSTRAP del cluster (workshop-demo-platform-config,
# bootstrap/ansible/bootstrap.yml), después de crear los AppProjects y el CR
# ArgoCD. A partir de aquí gobierna Argo CD: esta Application no despliega
# cargas de trabajo, sino que apunta al directorio que contiene las demás
# Applications. Añadir un componente nuevo al workshop consiste en añadir un
# archivo a ese directorio y confirmarlo en Git; no vuelve a hacer falta ningún
# "oc apply".
#
# Corre en el AppProject gitops-control (creado por el bootstrap): whitelist
# mínima — solo puede crear Applications en el namespace de Argo, nunca
# AppProjects ni recursos de cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-root
  labels:
    # Distingue de un vistazo qué es infraestructura y qué es aplicación.
    workshop.redhat.com/layer: gitops
    workshop.redhat.com/component: root-app-of-apps
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  project: gitops-control
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
    targetRevision: main
    path: bootstrap/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
