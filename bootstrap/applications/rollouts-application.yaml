# Onda 0 — el controlador de Argo Rollouts, junto al resto de la plataforma.
# Debe existir ANTES que cualquier Rollout: sin el controlador, el CR se queda
# sin nadie que lo reconcilie y no se crea ni un pod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-rollouts
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: workshop-platform
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
    targetRevision: main
    path: platform/rollouts/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
