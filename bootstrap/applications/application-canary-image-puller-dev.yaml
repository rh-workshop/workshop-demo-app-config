# Onda 1 — el permiso de descarga de imagen se concede en "workshop-demo-dev"
# (el namespace dueño del ImageStream), no donde corren los pods de canary, por
# eso es una Application aparte con ese destino. Debe existir ANTES que los
# Deployments de la onda 2 o el primer arranque queda en ImagePullBackOff.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canary-image-puller-dev
  labels:
    # Distingue de un vistazo qué es infraestructura y qué es aplicación.
    workshop.redhat.com/layer: application
    workshop.redhat.com/component: canary
    workshop.redhat.com/environment: dev
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: workshop-platform
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
    targetRevision: main
    path: apps/canary-service/image-puller/base
  destination:
    server: https://kubernetes.default.svc
    namespace: workshop-demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
