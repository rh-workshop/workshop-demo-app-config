# Onda 2 — el servicio que demuestra la entrega progresiva, junto al resto de
# las aplicaciones. Necesita el controlador de la onda 0 y la Route de la onda 1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollout-service-dev
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: workshop-platform
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
    targetRevision: main
    path: apps/rollout-service/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: rollout-demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
