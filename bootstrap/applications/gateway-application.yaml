# Onda 1 — gateway compartido de la plataforma y sus políticas transversales.
# Se despliega antes que las aplicaciones: una ruta no puede adjuntarse a un
# gateway que todavía no existe.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-gateway
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: workshop-platform
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
    targetRevision: main
    path: platform/gateway/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-gateway
  # El dominio real del cluster se fija en vivo (dia 0) y Argo lo respeta: el repo queda generico.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: Gateway
      jqPathExpressions:
        - .spec.listeners[].hostname
    - group: kuadrant.io
      kind: AuthPolicy
      jqPathExpressions:
        - .spec.rules.authentication[]?.jwt.issuerUrl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
