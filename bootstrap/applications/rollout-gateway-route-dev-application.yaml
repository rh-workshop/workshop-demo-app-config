# Onda 1 — la Route passthrough del servicio de rollouts vive en platform-gateway
# (junto al gateway), por eso es una Application aparte con ese destino.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollout-gateway-route-dev
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: workshop-platform
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
    targetRevision: main
    path: apps/rollout-service/gateway-route/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
