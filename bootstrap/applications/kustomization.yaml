# Applications que componen el workshop, ordenadas por onda de sincronización.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-gitops

# La configuración del propio Argo CD (CR ArgoCD, AppProjects, RBAC) NO está
# aquí: la aplica el bootstrap de workshop-demo-platform-config, porque lo que
# Argo necesita para existir no lo gestiona Argo.
resources:
  - application-demo-service-dev.yaml
  - application-platform-pipelines.yaml
  - application-policies-dev.yaml
  - application-canary-service-dev.yaml
  - application-canary-gateway-route-dev.yaml
  - application-circuit-breaker-service-dev.yaml
  - application-circuit-breaker-gateway-route-dev.yaml
  - application-bluegreen-service-dev.yaml
  - application-bluegreen-gateway-route-dev.yaml
  - application-api-service-dev.yaml
  - application-api-gateway-route-dev.yaml
  - application-image-pullers-dev.yaml
