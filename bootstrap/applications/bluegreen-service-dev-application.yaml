# Onda 2 — parte del escenario blue-green.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bluegreen-service-dev
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: workshop-platform
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
    targetRevision: main
    path: apps/bluegreen-service/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: bluegreen-demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
