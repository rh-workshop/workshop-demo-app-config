# Onda 3 — políticas de exposición del servicio.
# Van después de la aplicación porque se declaran SOBRE su HTTPRoute: si la ruta
# no existe todavía, la política no tiene destino al que adjuntarse.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: politicas-dev
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: workshop-platform
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-config.git
    targetRevision: main
    path: policies/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: workshop-demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
