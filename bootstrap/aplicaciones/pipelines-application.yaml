# Onda 2 — definiciones de construcción (Pipeline e identidad que lo ejecuta).
# Argo CD gobierna la DEFINICIÓN del pipeline; las ejecuciones (PipelineRun) las
# dispara quien construye, y no las gestiona Argo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-pipelines
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: workshop-platform
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-config.git
    targetRevision: main
    path: platform/pipelines/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: workshop-demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
