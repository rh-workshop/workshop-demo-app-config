# Onda 1 — gateway compartido de la plataforma y sus políticas transversales.
# Se despliega antes que las aplicaciones: una ruta no puede adjuntarse a un
# gateway que todavía no existe.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-gateway
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: workshop-platform
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-config.git
    targetRevision: main
    path: platform/gateway/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
